<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifeline Blood Network</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                🩸
            </div>

            <h1>Lifeline Blood Network</h1>

            <p class="subtitle">
                Blood Emergency & Donor Management System
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <p class="signup-text">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
